<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu compra! | Pallay</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .status-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .status-icon {
            font-size: 5rem;
            color: #2ecc71; /* Verde éxito */
            margin-bottom: 1.5rem;
            animation: bounceIn 0.8s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">PALLAY<span class="dot">.</span></a>
        </div>
    </nav>

    <div class="status-container">
        <i class="ph-fill ph-check-circle status-icon"></i>
        <h1 style="margin-bottom: 1rem;">¡Pago Exitoso!</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem; max-width: 500px;">
            Tu orden está siendo procesada. Has recibido un correo de confirmación de Stripe. ¡Gracias por confiar en la naturaleza inalterada de Pallay!
        </p>
        <a href="index.html" class="btn btn-primary">Volver a la Tienda</a>
    </div>

    <!-- Limpiamos el carrito automáticamente porque la compra fue exitosa -->
    <script>
        localStorage.removeItem('pallay_cart');
    </script>
</body>
</html>
