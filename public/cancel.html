<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Cancelado | Pallay</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .status-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .status-icon {
            font-size: 5rem;
            color: #e74c3c; /* Rojo error */
            margin-bottom: 1.5rem;
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">PALLAY<span class="dot">.</span></a>
        </div>
    </nav>

    <div class="status-container">
        <i class="ph-fill ph-x-circle status-icon"></i>
        <h1 style="margin-bottom: 1rem;">Compra Cancelada</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem; max-width: 500px;">
            El proceso de pago fue interrumpido o declinado. No se ha realizado ningún cobro a tu tarjeta. Tu carrito de compras sigue guardado por si deseas intentarlo más tarde.
        </p>
        <a href="index.html" class="btn btn-secondary">Intentar Nuevamente</a>
    </div>
</body>
</html>
